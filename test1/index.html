<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo List</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #182433;
    }

    header, main, footer {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    #todos {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card {
      background: white;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 18px;
      overflow-wrap: anywhere;
    }

    @media (min-width: 768px) {
      #todos {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Todo List</h1>
    <p id="count" aria-live="polite">Waiting for tasks</p>
  </header>

  <main>
    <p id="status" role="status">Loading…</p>
    <section id="todos" aria-label="Todo cards"></section>
  </main>

  <footer>
    <p>420-A07-TV — Test 1</p>
  </footer>

  <script>
    const list = document.querySelector("#todos");
    const count = document.querySelector("#count");
    const statusMessage = document.querySelector("#status");

    async function loadTodos() {
      statusMessage.textContent = "Loading…";

      try {
        const response = await fetch(
          "https://jsonplaceholder.typicode.com/todos?_limit=12"
        );

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const todos = await response.json();
        list.replaceChildren();
        let completed = 0;

        for (const todo of todos) {
          const card = document.createElement("article");
          card.className = "card";

          const title = document.createElement("h2");
          title.textContent = todo.title;

          const state = document.createElement("p");
          state.textContent = todo.completed
            ? "✅ Completed"
            : "⬜ Not completed";

          card.append(title, state);
          list.append(card);

          if (todo.completed) {
            completed++;
          }
        }

        count.textContent =
          `${completed} of ${todos.length} completed`;

        statusMessage.textContent =
          todos.length === 0 ? "No tasks to show." : "";
      } catch (error) {
        count.textContent = "Tasks unavailable";
        statusMessage.textContent =
          "Could not load your tasks. Check your internet connection and refresh to try again.";
      }
    }

    loadTodos();
  </script>
</body>
</html>
